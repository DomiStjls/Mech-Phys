<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Механика: рисоватор</title>
    <style>
        svg {
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        circle.grid-node {
            cursor: pointer;
            fill: transparent;
            stroke: #888;
        }

        circle.selected {
            fill: red;
        }
    </style>
</head>

<body>
    <div id="header" style="display: flex; justify-content: center;">
        <div id="title">
            <h1>Рисоватор задач по механике</h1>
            <!-- 
            <form action="/add" method="post">
                <label for="x">X:</label>
                <input type="number" id="x" name="x" required>
                <label for="y">Y:</label>
                <input type="number" id="y" name="y" required>

                <label for="type">Тип:</label>
                <select name="type" id="type">
                    <option value="block">Блок</option>
                    <option value="force">Сила</option>
                </select>

                <button type="submit">Добавить</button>
            </form> -->
            <div id="controls">
                <button id="clear-btn" type="button">Очистить рисунок</button>
            </div>
        </div>
    </div>

    <div id="main" style="display: flex; justify-content: center;">
        <svg width="800" height="800" xmlns="http://www.w3.org/2000/svg" id="grid-svg">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"
                    markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="red" />
                </marker>
            </defs>

            <!-- Сетка -->
            <g stroke="#ccc" stroke-opacity="0.7" stroke-width="2">
                {% for x in range(0, 800 + 1, 50) %}
                <line x1="{{ x }}" y1="0" x2="{{ x }}" y2="800" />
                {% endfor %}
                {% for y in range(0, 800 + 1, 50) %}
                <line x1="0" y1="{{ y }}" x2="800" y2="{{ y }}" />
                {% endfor %}
            </g>

            <!-- Оси координат -->
            <g stroke="black" stroke-width="2">
                <line x1="0" y1="800" x2="800" y2="800" />
                <line x1="0" y1="800" x2="0" y2="0" />
            </g>

            <!-- Деления -->
            <g stroke="black" stroke-width="1">
                {% for dx in range(0, 800 + 1, 50) %}
                <line x1="{{ dx }}" y1="{{ 800 - 5 }}" x2="{{ dx }}" y2="{{ 800 + 5}}" />
                {% endfor %}
                {% for dy in range(0, 800 + 1, 50) %}
                <line x1="0" y1="{{ dy }}" x2="5" y2="{{ dy }}" />
                {% endfor %}
            </g>

            <!-- Подписи -->
            <g fill="black" font-size="10" text-anchor="middle">
                {% for dx in range(50, 751, 50) %}
                <text x="{{ dx }}" y="790">{{ dx * 2 // 100 }}</text>
                {% endfor %}
                {% for dy in range(750, 49, -50) %}
                <text x="15" y="{{ dy }}" text-anchor="end">{{ 800 * 2 // 100 - dy * 2 // 100 }}</text>
                {% endfor %}
            </g>

            <!-- Узлы сетки (точки) -->
            <g id="grid-nodes">
                {% for x in range(50, 800 - 50 + 1, 50) %}
                {% for y in range(50, 800 - 50 + 1, 50) %}
                <circle class="grid-node" cx="{{ x }}" cy="{{ y }}" r="5" data-x="{{ x }}" data-y="{{ y }}" />
                {% endfor %}
                {% endfor %}
            </g>

            {{ svg_elements|safe }}
        </svg>
    </div>

    <script>
        let selectedNodes = [];
        document.querySelectorAll('circle.grid-node').forEach(circle => {
            circle.addEventListener('click', () => {
                if (selectedNodes.length < 2) {
                    circle.classList.add('selected');
                    selectedNodes.push({ x: circle.dataset.x, y: circle.dataset.y });
                }

                if (selectedNodes.length === 2) {
                    // Отправить запрос на сервер для создания блока
                    fetch('/add_block_by_nodes', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            x1: selectedNodes[0].x,
                            y1: selectedNodes[0].y,
                            x2: selectedNodes[1].x,
                            y2: selectedNodes[1].y
                        })
                    }).then(response => {
                        if (response.ok) location.reload();
                        else alert("Ошибка при добавлении блока.");
                    });

                    // Сброс
                    selectedNodes.forEach(n => {
                        const el = document.querySelector(`circle[data-x="${n.x}"][data-y="${n.y}"]`);
                        el.classList.remove('selected');
                    });
                    selectedNodes = [];
                }
            });
        });

        // Кнопка очистить рисунок
        document.getElementById('clear-btn').addEventListener('click', () => {
            fetch('/clear', { method: 'POST' }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Ошибка при очистке.');
                }
            });
        });
    </script>
</body>

</html>
