<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Механика: Чертеж</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>

    </style>
</head>

<body>
    <div id="canvas">
        <svg id="drawing-area" width="100%" height="100%">

            {{ svg_elements|safe }}

        </svg>
    </div>
    <div id="sidebar">
        <div class="object-option">
            <label><input type="radio" name="mode" value="plane" {% if mode=='plane' %}checked{% endif %}>
                Плоскость</label>
            <div>
                Угол наклона: <input type="number" id="plane-angle" min="0" max="180"
                    value="{{ params['plane_angle'] }}">°
                <br>
                Длина: <input type="number" id="plane-length" min="10" max="2000" value="{{ params['plane_length'] }}">
                px
            </div>
        </div>
        <div class="object-option">
            <label><input type="radio" name="mode" value="block" {% if mode=='block' %}checked{% endif %}> Груз</label>
            <div>
                Длина: <input type="number" id="block-width" min="10" max="2000" value="{{ params['block_width'] }}"> px
                <br>
                Высота: <input type="number" id="block-height" min="10" max="1000" value="{{ params['block_height'] }}">
                px
            </div>
        </div>
        <div class="object-option">
            <label><input type="radio" name="mode" value="string" {% if mode=='string' %}checked{% endif %}>
                Нить</label>
            <div>
                Крепление:
                <select id="string-attachment">
                    <option value="one-way" {% if params['string_attachment']=='one-way' %}selected{% endif %}>
                        Одностороннее (сначала выберете интерактивную точку, а потом точку основания)
                    </option>
                    <option value="two-way" {% if params['string_attachment']=='two-way' %}selected{% endif %}>
                        Двустороннее (две точки)
                    </option>

                </select>

            </div>
        </div>
        <button id="clear-btn" type="button">Очистить рисунок</button>
    </div>

    <!-- <script id="scene-data" type="application/json">{{ scene | tojson }}</script> -->
    <script src="/static/script.js"></script>

</body>

</html>
