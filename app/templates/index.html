<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Механика: Чертеж</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>

    </style>
</head>

<body>
    <div id="canvas">
        <svg id="drawing-area" width="100%" height="100%">

            {{ svg_elements|safe }}

        </svg>
    </div>
    <div id="sidebar">
        <div class="object-option">
            <label><input type="radio" name="mode" value="plane" {% if mode == 'plane' %}checked{% endif %}> Плоскость</label>
            <div>
                Угол наклона: <input type="number" id="plane-angle" value="0">°
                <br>
                Длина: <input type="number" id="plane-length" value="500"> px
            </div>
        </div>
        <div class="object-option">
            <label><input type="radio" name="mode" value="block" {% if mode == 'block' %}checked{% endif %}> Груз</label>
            <div>
                Длина: <input type="number" id="block-width" value="80"> px
                <br>
                Высота: <input type="number" id="block-height" value="40"> px
            </div>
        </div>
        <div class="object-option">
            <label><input type="radio" name="mode" value="string" {% if mode == 'string' %}checked{% endif %}> Нить</label>
            <div>
                Крепление:
                <select id="string-attachment">
                    <option value="one-way">Одностороннее</option>
                    <option value="two-way">Двустороннее</option>
                </select>
            </div>
        </div>
        <button id="clear-btn" type="button">Очистить рисунок</button>
    </div>

    <!-- <script id="scene-data" type="application/json">{{ scene | tojson }}</script> -->
    <script src="/static/script.js"></script>

</body>

</html>
